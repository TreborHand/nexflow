<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NexFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;background:#0b1220}</style>
</head>
<body>
<title>NexFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Desktop = menu lateral + área de trabalho (+ celular ao lado no "fluxo ao vivo"). Celular = barra superior + abas inferiores + botão flutuante. */
/* Sistema visual v2: uma família só (azul-marinho), neutros frios e UM acento verde.
   Status = ponto colorido + texto neutro; cor cheia só no botão principal. */
:root{
  --bg:#0b1220; --surface:#111a2b; --surface2:#16213a; --raise:#1c2944; --ink:#e6ecf5; --ink2:#c3cede; --muted:#8a97ad; --line:#1f2c44; --line2:#2a3a58;
  --side:#08101d; --side-ink:#e6ecf5; --side-mut:#7f8ca5;
  --top:#0b1220; --top-ink:#e6ecf5; --top-mut:#8a97ad; --top-ctl:#111a2b; --top-act:#1c2944; --top-line:#1f2c44;
  --primary:#33e08a; --on-primary:#03230f; --primary-soft:rgba(51,224,138,.12); --primary-ink:#5cf0a6;
  --teal:#9fb2d6; --teal-soft:rgba(159,178,214,.12);
  --ok:#5cf0a6; --ok-soft:rgba(51,224,138,.12); --warn:#e8b04a; --warn-soft:rgba(232,176,74,.12); --bad:#f07080; --bad-soft:rgba(240,112,128,.12); --info:#9fb2d6; --info-soft:rgba(159,178,214,.12);
  --avbg:#1e2b45; --avink:#c9d5ea;
  --hero1:#14233f; --hero2:#0e182c;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.22);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html.light{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#f6f8fb; --raise:#ffffff; --ink:#0e1626; --ink2:#2b3850; --muted:#5b6880; --line:#e3e8f0; --line2:#d5dce8;
  --side:#0e1626; --side-ink:#e6ecf5; --side-mut:#8a97ad;
  --top:#ffffff; --top-ink:#0e1626; --top-mut:#5b6880; --top-ctl:#f2f4f8; --top-act:#ffffff; --top-line:#e3e8f0;
  --primary:#33e08a; --on-primary:#03230f; --primary-soft:#e4f9ee; --primary-ink:#0b7a47;
  --teal:#4a5b7a; --teal-soft:#edf1f7;
  --ok:#0b7a47; --ok-soft:#e4f6ec; --warn:#9a6b00; --warn-soft:#fbf2df; --bad:#c23b4a; --bad-soft:#fbe9eb; --info:#4a5b7a; --info-soft:#edf1f7;
  --avbg:#e6ebf3; --avink:#2b3850;
  --hero1:#0e1626; --hero2:#1a2b4f;
  --shadow:0 1px 2px rgba(14,22,38,.04),0 6px 18px rgba(14,22,38,.06);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
.mut{color:var(--muted)}
.sm{font-size:13px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding-block:22px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 20px}
.mk{flex:none;width:36px;height:36px;display:block}.lg-brand .mk{width:62px;height:62px}
.mk-halo{animation:mkHalo 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mkHalo{0%,26%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}58%,100%{opacity:.35;transform:scale(.8)}}
.brand b{font-size:23px;display:block;line-height:1.1}
.wm{display:inline-block;height:.8em;width:3.64em;vertical-align:-.04em;overflow:visible;font-family:var(--sans);font-weight:800;fill:currentColor;transform-origin:50% 60%;animation:wmPulse 7s ease-in-out infinite}
.wm .wmT{fill:var(--primary)}html.light .wm .wmT{fill:var(--primary-ink)}.lg-brand .wm .wmT{fill:#33e08a}
.wm-glow{opacity:.75}
.wm-sh{animation:wmShine 7s cubic-bezier(.45,0,.35,1) infinite}
@keyframes wmShine{0%{transform:translateX(0)}30%{transform:translateX(4740px)}100%{transform:translateX(4740px)}}
@keyframes wmPulse{0%,28%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(125,255,189,0))}39%{transform:scale(1.025);filter:drop-shadow(0 0 .12em rgba(125,255,189,.3))}52%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(125,255,189,0))}}
@media (prefers-reduced-motion:reduce){.wm,.wm-sh,.mk-halo{animation:none}}
.brand small{color:var(--side-mut);font-size:12px}
.side .nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--side-mut);font-weight:600;font-size:14.5px;text-align:left}
.side .nv:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.side .nv[aria-current="page"]{color:var(--side-ink);background:rgba(255,255,255,.08);box-shadow:inset 3px 0 0 var(--primary)}
.side .nv .bd{margin-left:auto}
.bd{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.side .mecard{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.mecard>.av{flex:none}
.mecard>div{flex:1;min-width:0}
.mecard b{display:block;line-height:1.25}
.side .mecard small{display:block;color:var(--side-mut);font-size:12px;line-height:1.35}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--top);color:var(--side-ink);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.demo{font-family:var(--mono);font-size:11px;letter-spacing:.04em;background:var(--warn-soft);color:var(--warn);padding:3px 9px;border-radius:999px;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sp{flex:1}
@media (max-width:1520px){.topbar .dt{display:none}}
.topbar .mut,.topbar .sync{color:var(--side-mut)}
.topbar .seg{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
.topbar .seg button{color:var(--side-mut)}
.topbar .seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);box-shadow:none}
.topbar .live{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--side-ink)}
.topbar .live[aria-pressed="true"]{background:var(--side-ink);color:var(--side);border-color:var(--side-ink)}
.themebtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--side-ink)}
.live{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--side);color:var(--side-ink);border:1px solid var(--side)}
.live[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 rgba(51,224,138,.6);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(51,224,138,.55)}70%{box-shadow:0 0 0 7px rgba(51,224,138,0)}100%{box-shadow:0 0 0 0 rgba(51,224,138,0)}}
.work{display:flex;gap:28px;align-items:flex-start;padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1180px}
.content.narrow{max-width:560px;margin:0 auto}

.phonecol{position:sticky;top:90px;display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.phonecol .cap{font-size:12.5px;color:var(--muted);font-weight:600;max-width:330px;text-align:center}
.phone{width:350px;height:720px;border-radius:46px;background:#060b0a;padding:11px;box-shadow:0 30px 60px rgba(0,0,0,.28)}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#060b0a;z-index:5}
.mapp{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.mapp .abar{padding:40px 18px 12px;display:flex;align-items:center;gap:10px;background:var(--top);color:var(--side-ink);border-bottom:1px solid rgba(255,255,255,.06)}
.mapp .abar h2{font-size:18px;flex:1}
.mapp .mbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.mapp .tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 14px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
.tabs button[aria-current="page"]{color:var(--primary-ink)}
.tabs button .bd{position:absolute;top:0;right:calc(50% - 22px);height:17px;min-width:17px;font-size:10.5px}

.mobileapp{display:none;flex-direction:column;min-height:100vh}
body.desk .shell{display:grid!important;width:1280px}
body.desk .mobileapp{display:none!important}
body.desk .side{position:relative;height:auto}
body.desk .topbar{position:relative;top:0}
.mbanner button{text-decoration:underline;font:inherit;color:inherit;margin-left:6px}
.deskback{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:none;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap}
@media (max-width:899px){body.desk .deskback{display:inline-flex}}
@media (max-width:899px){
  .shell{display:none!important}
  .mobileapp{display:flex}
}
.mobileapp .abar{position:sticky;top:0;z-index:20;background:var(--top);color:var(--side-ink);border-bottom:1px solid rgba(255,255,255,.06);padding-block:max(12px,env(safe-area-inset-top,0px)) 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.mobileapp .abar h2{flex:1;font-size:18px}
.mobileapp .mbody{flex:1;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.mobileapp .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.mbanner{font-family:var(--mono);font-size:10.5px;text-align:center;background:var(--warn-soft);color:var(--warn);padding:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>*{min-width:0}.m .grid2:not(.keep2){grid-template-columns:minmax(0,1fr)}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.mcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
@media(max-width:1180px){.mcard{grid-template-columns:1fr}}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.m .mstats{grid-template-columns:repeat(2,minmax(0,1fr))}
.mstats div{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);min-width:0}
.mstats span{font-size:12px;color:var(--muted);font-weight:600}.mstats b{font-size:20px;white-space:nowrap}.mstats small{font-size:11.5px;color:var(--muted)}
.mbar{position:relative;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--primary);transition:width .6s}
.mbar em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.chartd{width:100%;height:auto;display:block}.chartd .gl{stroke:var(--line);stroke-width:1}.chartd .ax{fill:var(--muted);font-size:10.5px;font-weight:600}
.chartd .bv{fill:var(--primary-ink)}.chartd .bv.nw{fill:var(--primary)}.chartd .bh:hover .bv{opacity:.75}.chartd .bp{fill:var(--line2)}
.chartd .rl{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4}.chartd .rlt{fill:var(--ink2)}
.mcard .big,.m .card .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1}
.rk{width:20px;text-align:center;font-weight:800;color:var(--muted)}
.dotx{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:none;margin:0 6px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:clamp(19px,1.7vw,25px);font-weight:800;white-space:nowrap}
.kpi .h{font-size:12.5px;color:var(--muted)}
.kpi.hl{background:var(--primary-soft);border-color:transparent}
.kpi.hl .v{color:var(--primary-ink)}
.hero{border-radius:16px;padding:20px;background:linear-gradient(135deg,var(--hero1),var(--hero2));border:1px solid rgba(51,224,138,.18);color:#e8edf5;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--primary) 50%,transparent 100%);background-size:200% 100%;animation:fiber 3.5s linear infinite}
@keyframes fiber{from{background-position:100% 0}to{background-position:-100% 0}}
.hero small{color:#9fb0cc;font-weight:600}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.01em}
.hero .hr{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:#b9c6dc}
.hero .hr b{color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.t{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn.o{border-color:var(--primary-ink);color:var(--primary-ink)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding-block:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)} .c-teal{background:var(--teal-soft);color:var(--teal)} .c-mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)} .c-pri{background:var(--primary-soft);color:var(--primary-ink)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface2)}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .tx b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;max-width:55%}
.li .rt .chip{white-space:normal;text-align:right}
.li .acts{display:flex;gap:6px;flex:none;margin-left:auto}
.li.lw{flex-wrap:wrap}.li.lw .tx{flex:1 1 200px}
.m .seg{display:flex;width:100%}.m .seg button{flex:1;padding:7px 4px;font-size:12.5px}
.m .li .rt{max-width:45%}
.li.new{animation:hl 2.4s ease-out}
@keyframes hl{0%{background:var(--primary-soft)}100%{background:transparent}}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface2)}
tr.sub td{background:var(--surface2);font-size:13px}

.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px}
.alert .b{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.alert .b small{color:var(--muted);font-size:13px}
.a-ok{background:var(--ok-soft)} .a-warn{background:var(--warn-soft)} .a-bad{background:var(--bad-soft)} .a-info{background:var(--info-soft)} .a-teal{background:var(--teal-soft)}
.a-ok>svg{color:var(--ok)} .a-warn>svg{color:var(--warn)} .a-bad>svg{color:var(--bad)} .a-info>svg{color:var(--info)} .a-teal>svg{color:var(--teal)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}

// ---------- utilidades ----------
const dig = (s) => String(s || '').replace(/\D/g, '');
function cpfValido(c) {
  c = dig(c);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== +c[t]) return false;
  }
  return true;
}
const fmtCpf = (c) => (c = dig(c)).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
let OFF = 0;
const agora = () => new Date(Date.now() - OFF).toISOString();
function hora() {
  return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
}
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function conversa(s, num, nomePerfil) {

// ---------- leitura da ficha ----------
function ehFicha(texto) {
  const t = norm(texto);
  if (t.includes('ficha padrao')) return true;
  const rotulos = (t.match(/^[\s\W]*[a-z][a-z \/()]{1,25}\s*:/gm) || []).length;
  return rotulos >= 5 && t.includes('cpf');
}
function lerFicha(texto) {
  const f = {};
  for (const linha of String(texto).split('\n')) {
    const m = linha.match(/^[\s\W]*([A-Za-zÀ-ú][A-Za-zÀ-ú \/()°º.\-]{0,30}?)\s*[:：]\s*(.*)$/);
    if (!m) continue;
    const rot = norm(m[1]).replace(/[.]/g, '');
    const val = m[2].trim();
    for (const [k, labels] of CAMPOS) {
      if (f[k]) continue;
      if (labels.some((l) => norm(l) === rot)) {
        f[k] = val;
        break;
      }
    }
  }
  return f;
}
function faltando(f) {
  const out = [];
  for (const [k, , obrig] of CAMPOS) if (obrig && !f[k]) out.push(NOME_CAMPO[k] || k);
  if (/debito|débito/i.test(f.pagamento || '')) for (const k of ['banco', 'agencia', 'conta']) if (!f[k]) out.push(NOME_CAMPO[k]);
  return out;
}

// ---------- regras do bot ----------
function novaConsulta(s, num, cpf, origem) {
  const ja = s.consultas.find((q) => q.cpf === cpf && q.status === 'pendente');
  if (ja) return ja;
  const q = { id: s.seq++, cpf, de: num, pedidaEm: agora(), status: 'pendente', resultado: null, obs: '', origem, atendente: null };
  s.consultas.push(q);
  return q;
}
function ultimaConsulta(s, cpf) {
  return s.consultas.filter((q) => q.cpf === cpf).sort((a, b) => b.id - a.id)[0];
}

function responderMensagem(env, s, num, nomePerfil, texto) {
  const c = conversa(s, num, nomePerfil);
  log(c, 'vendedor', texto);
  const respostas = [];
  const t = norm(texto);

  // conversa com uma pessoa do back office: o bot fica calado
  if (c.humano) return respostas;

  if (ehFicha(texto)) {
    const f = lerFicha(texto);
    const cpf = dig(f.cpf);
    if (!cpf || !cpfValido(cpf)) {
      respostas.push('Recebi a ficha, mas o CPF está faltando ou não é válido. Confira e mande de novo, por favor.');
      return respostas;
    }
    const falta = faltando(f);
    if (falta.length) {
      respostas.push('Recebi a ficha de ' + (f.nome || 'cliente') + ', mas está faltando:\n- ' + falta.join('\n- ') + '\n\nMande a ficha de novo com esses dados completos.');
      return respostas;
    }
    const cons = ultimaConsulta(s, cpf);
    const ficha = { id: s.seq++, de: num, recebidaEm: agora(), dados: f, cpf, status: 'aguardando consulta' };
    if (cons && cons.status === 'respondida') {
      if (cons.resultado === 'reprovado' || cons.resultado === 'inviavel') {
        respostas.push('Esse CPF (' + fmtCpf(cpf) + ') teve a consulta como "' + RESULTADOS[cons.resultado] + '". Não dá para seguir com a ficha.');
        return respostas;
      }
      if (cons.resultado === 'cartao' && !/cart/i.test(f.pagamento || '')) {
        respostas.push('Esse CPF foi aprovado apenas para cartão de crédito. Ajuste a forma de pagamento para cartão e mande a ficha de novo.');
        return respostas;
      }
      ficha.status = 'pronta para cadastro';
      s.fichas.push(ficha);
      respostas.push('Ficha de ' + f.nome + ' recebida. Protocolo #' + ficha.id + '.\nJá está com o back office para o cadastro. Te aviso por aqui do andamento.');
      return respostas;
    }
    s.fichas.push(ficha);
    const q = cons && cons.status === 'pendente' ? cons : novaConsulta(s, num, cpf, 'ficha');
    ficha.consultaId = q.id;
    respostas.push('Obrigado pelo envio da ficha de ' + f.nome + ' (protocolo #' + ficha.id + ').\nNeste momento, estamos validando o CPF do cliente informado. Assim que a consulta sair, te aviso por aqui e a ficha segue para o cadastro.');
    return respostas;
  }

  const cpfs = [...new Set((texto.match(/\d{3}\.?\d{3}\.?\d{3}-?\d{2}/g) || []).map(dig))];

  if (/^(status|situacao)/.test(t) || (cpfs.length === 1 && /status|situacao|como esta/.test(t))) {
    if (!cpfs.length) return ['Me mande o CPF junto. Ex.: "status 123.456.789-09".'];
    const cpf = cpfs[0];
    const fi = s.fichas.filter((x) => x.cpf === cpf).sort((a, b) => b.id - a.id)[0];
    const q = ultimaConsulta(s, cpf);
    if (fi) return ['CPF ' + fmtCpf(cpf) + ': ficha #' + fi.id + ', situação "' + fi.status + '".'];
    if (q) return ['CPF ' + fmtCpf(cpf) + ': ' + (q.status === 'pendente' ? 'consulta em andamento com o back office.' : 'consulta respondida: ' + RESULTADOS[q.resultado] + '.')];
    return ['Não encontrei nada com o CPF ' + fmtCpf(cpf) + '. Quer consultar? Mande "consulta ' + fmtCpf(cpf) + '".'];
  }

  if (cpfs.length && (/consult|valid|ver cpf/.test(t) || norm(texto.replace(/[\d.\-\s]/g, '')) === '' || t === '1')) {
    const ok = [], ruins = [];
    for (const cpf of cpfs) (cpfValido(cpf) ? ok : ruins).push(cpf);
    if (ruins.length) respostas.push('Esses CPFs não são válidos, confira os números: ' + ruins.map(fmtCpf).join(', ') + '.');
    if (ok.length) {
      ok.forEach((cpf) => novaConsulta(s, num, cpf, 'pedido'));
      respostas.push('Recebido. ' + (ok.length > 1 ? 'As consultas dos CPFs ' : 'A consulta do CPF ') + ok.map(fmtCpf).join(', ') + (ok.length > 1 ? ' já estão' : ' já está') + ' com o back office. Te aviso por aqui assim que sair.');
    }
    return respostas;
  }

  if (/^(oi|ola|bom dia|boa tarde|boa noite|menu|inicio|ajuda)\b/.test(t) || t === '0') return [TXT.menu];
  if (t === '1' || /^consult/.test(t)) return ['Me mande o CPF (ou vários, um por linha) para consultar.'];
  if (t === '2' || /enviar ficha|mandar ficha/.test(t)) return ['Pode colar a ficha aqui de uma vez. Se precisar do modelo, mande "6".'];
  if (t === '3') return ['Me mande "status" e o CPF. Ex.: "status 123.456.789-09".'];
  if (t === '4' || /campanha/.test(t)) return [TXT.campanha];
  if (t === '5' || /plano|pagamento|preco|valor/.test(t)) return [TXT.planos];
  if (t === '6' || /modelo|ficha padrao/.test(t)) return [TXT.modelo];
  if (t === '7' || /back ?office|atendente|pessoa|humano/.test(t)) {
    c.humano = true;
    c.humanoDesde = agora();
    return [TXT.humano];
  }
  c.humano = true;
  c.humanoDesde = agora();
  return [TXT.naoEntendi];
}


// ---------- mesmas regras da API do Worker (/api/consulta, assumir, responder, encerrar) ----------
function apiConsulta(s, b) {
  const q = s.consultas.find((x) => x.id === b.id);
  if (!q) return { erro: 'consulta não encontrada' };
  if (q.status === 'respondida' && !b.corrigir) return { erro: 'já respondida por ' + q.atendente };
  const corrigindo = q.status === 'respondida';
  q.status = 'respondida'; q.resultado = b.resultado; q.obs = b.obs || ''; q.atendente = b.atendente || 'Back office'; q.respondidaEm = agora();
  let msg = (corrigindo ? 'CORREÇÃO: ' : '') + 'CPF ' + fmtCpf(q.cpf) + ': ' + RESULTADOS[q.resultado] + '.' + (q.obs ? '\nObs.: ' + q.obs : '');
  const fichas = s.fichas.filter((f) => f.consultaId === q.id || (f.cpf === q.cpf && f.status === 'aguardando consulta'));
  if (q.resultado === 'total' || q.resultado === 'cartao') {
    if (fichas.length) {
      for (const f of fichas) {
        if (q.resultado === 'cartao' && !/cart/i.test(f.dados.pagamento || '')) { f.status = 'ajustar pagamento'; msg += '\nA ficha #' + f.id + ' está com pagamento diferente de cartão. Ajuste para cartão e mande de novo.'; }
        else { f.status = 'pronta para cadastro'; msg += '\nA ficha #' + f.id + ' seguiu para o cadastro.'; }
      }
    } else msg += q.resultado === 'cartao' ? '\nVenda só no cartão de crédito. Pode mandar a ficha.' : '\nPode mandar a ficha.';
  } else fichas.forEach((f) => (f.status = 'recusada na consulta'));
  conversa(s, q.de).msgs.push({ de: 'backoffice', texto: msg, t: agora(), n: q.atendente });
  return { ok: true, msg };
}
function apiAssumir(s, b) {
  const c = s.conversas[b.num];
  if (!c) return { erro: 'conversa não encontrada' };
  if (c.atendente && c.atendente !== b.atendente && !b.forcar) return { erro: 'em atendimento com ' + c.atendente };
  c.atendente = b.atendente; c.humano = true;
  return { ok: true };
}
function apiResponder(s, b) {
  const c = s.conversas[b.num];
  if (!c) return { erro: 'conversa não encontrada' };
  if (c.atendente && c.atendente !== b.atendente) return { erro: 'em atendimento com ' + c.atendente };
  c.msgs.push({ de: 'backoffice', texto: b.texto, t: agora(), n: b.atendente });
  return { ok: true };
}
function apiEncerrar(s, b) {
  const c = s.conversas[b.num];
  if (c) { c.humano = false; c.atendente = null; log(c, 'sistema', 'Atendimento encerrado; o assistente volta a responder.'); }
  return { ok: true };
}
function receber(s, num, nome, texto) {
  const r = responderMensagem(null, s, num, nome, texto);
  r.forEach((x) => log(conversa(s, num), 'bot', x));
  return r;
}
return { receber, apiConsulta, apiAssumir, apiResponder, apiEncerrar, fmtCpf, RESULTADOS, setOff: (m) => { OFF = m * 60000; } };
})();

function cpfMsg(F){if(F.pj)return '';var c=digits(F.cpf);if(!c)return '';if(c.length<11)return '';return cpfValid(c)?'<span class="ok">'+ic('check')+'CPF válido</span>':'<span class="bad">'+ic('alert')+'CPF inválido. Confira os números com o cliente.</span>'}

function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function conflitos(F){if(!F)return [];var t8=normTel(F.tel),c=digits(F.cpf),n=norm(F.nome),ak=addrKey(F);var out=[];
  CLIENTS.forEach(function(cl){var why=[];
    if(c.length>=11&&digits(cl.doc)===c)why.push('CPF');
    if(t8.length===8&&cl.tels.some(function(x){return normTel(x)===t8}))why.push('telefone');
    if(n&&ak&&norm(cl.nome)===n&&addrKey(cl)===ak)why.push('nome e endereço');
    if(why.length){var ls=lastSale(cl.id);out.push({id:cl.id,why:why,cli:cl.nome,os:ls?ls.os:null,fraude:why.indexOf('telefone')>=0&&norm(cl.nome)!==n})}});
  return out}

function vVenda(ctx,id){
  var s=saleById(id);if(!s)return '';
  var hmap={};s.hist.forEach(function(x){hmap[x[0]]=x[1]});
  var steps=[['Enviada','enviada']];if(hmap.analise||s.status==='analise'||s.status==='recusada')steps.push([(ctxRole(ctx)==='vendedor'||ctxRole(ctx)==='supervisor')?'Análise do back office':'Análise de cliente repetido (Diretor)','analise']);
  if(s.status==='recusada'){steps.push(['Recusada na análise','recusada'])}else if(s.status==='cancelada'){steps.push(['Selfie do cliente (biometria)','biometria']);steps.push(['Cancelada · sem biometria','cancelada'])}else{[['biometria','Selfie do cliente (biometria)'],['auditoria','Auditoria da operadora'],['cartao','Pagamento do cartão']].forEach(function(x){if(x[0]==='biometria'?!s.pj:(hmap[x[0]]||s.status===x[0]))steps.push([x[1],x[0]])});steps=steps.concat([['OS gerada na operadora','os'],['Instalada','instalada'],['Comissão paga','paga']])}
  var key=s.status==='atribuida'||s.status==='autorizada'?'instalada':s.status==='pronta'?'biometria':s.status;var cur=0;steps.forEach(function(x,i){if(x[1]===key)cur=i});if(s.status==='enviada'&&hmap.analise)cur=1;
  var h=(isM(ctx)?'':'<button class="btn s" type="button" data-back="1" style="align-self:flex-start">'+ic('back')+'Voltar</button>');
  h+='<div class="card pad stack"><div class="row between"><div class="stack" style="gap:2px;min-width:0"><h2>'+esc(s.cliente)+'</h2><span class="mut sm">'+PROD[s.vel]+' · '+esc(s.bairro)+'</span></div>'+chipSt(s)+'</div>';
  if(s.os)h+='<div class="row sm mut"><span>OS <b class="mono" style="color:var(--ink)">'+s.os+'</b></span>'+(s.dia?'<span>· '+esc(s.dia)+'</span>':'')+'</div>';
  h+='</div><div class="card pad"><div class="tl">'+steps.map(function(x,i){var x1=x[1];var rc=(s.status==='recusada'||s.status==='cancelada');var hold=(s.status==='analise'||s.status==='atribuida'||s.status==='biometria');var c=(i<cur||(i===cur&&!hold&&!rc))?'done':((i===cur&&hold)||(i===cur+1&&!hold&&!rc))?'cur':'';if(rc&&x1===s.status)c='bad';
    return '<div class="st '+c+'"><span class="dot">'+(c==='done'?ic('check'):'')+'</span><div class="tx"><b>'+x[0]+(s.status==='atribuida'&&i===4?' · aguardando baixa do técnico':'')+'</b><span class="mut sm">'+(hmap[x[1]]||(c==='cur'?'agora':''))+'</span></div></div>'}).join('')+'</div></div>';
  if(s.status==='analise')h+=((ctxRole(ctx)==='vendedor'||ctxRole(ctx)==='supervisor')?alrt('warn','clock','Venda em análise pelo back office','Algumas informações desta venda estão sendo conferidas antes do cadastro na operadora. Você não precisa fazer nada agora: assim que a análise terminar, você será avisado aqui.'):alrt('warn','lock','Venda em análise','Encontramos '+confTxt(s)+' em outra conta. O Diretor vai avaliar.'));
  if(s.status==='recusada')h+=recusaCard(s);
  if(s.status==='biometria')h+=vendBio(s,ctx);
  if(s.hold&&(ctxRole(ctx)==='vendedor'||ctxRole(ctx)==='supervisor'))h+=alrt('info','lock','Pagamento em conferência','Esta instalação ficou para o próximo fechamento enquanto o Diretor confere.');
  if(s.status==='cancelada')h+=alrt('bad','alert','Venda cancelada','O cliente não concluiu a biometria (selfie). Sem ela, a operadora não libera a instalação.');
  if(s.status!=='recusada')h+='<div class="card pad row between"><span>Comissão nesta venda</span><b class="num" style="font-size:20px">'+f(valorItem(s).total)+'</b></div>';
  return h;
}

  if(t.id==='cfgSave'){var D2=draftCfg();CFG.base=clone(D2.base);CFG.perfis=clone(D2.perfis);SELLERS.forEach(function(x){x.perfil=D2.sp[x.id]});S.draft=null;logA('fin','alterou os perfis de comissão (valem a partir de hoje)');render();toast('Perfis salvos. Valem a partir de hoje. Pagamentos anteriores não mudam.');return}
  if(d.rq!==undefined){S.rq=+d.rq;S.csel={};render();return}
  if(t.id==='openCont'){S.csel={};contSheet();return}
  if(t.id==='ctDown'){contDownload();return}
  if(d.contview!==undefined){var cv=S.contests[+d.contview];sheet('<h2>E-mail enviado</h2>'+line('Para',esc(cv.para))+line('Assunto',esc(cv.ass))+line('Enviado em',esc(cv.em)+' por '+esc(cv.by))+'<pre class="mailtxt">'+esc(cv.txt)+'</pre><div class="field"><span>Planilha anexada · '+cv.n+' OS</span><div class="tablewrap ct-tab"><table><tr><th>OS</th><th>Ativação</th><th>Produto</th></tr>'+cv.itens.map(function(x){return '<tr><td class="mono">'+x.os+'</td><td>'+x.atv+'/2026</td><td>'+esc(x.prod)+'</td></tr>'}).join('')+'</table></div></div><button class="btn block" type="button" data-close="1">Fechar</button>',true);return}
  if(t.id==='ctSend'){var para=(document.getElementById('ctPara').value||'').trim(),er=document.getElementById('ctErr');var sel=contRows().filter(function(x){return S.csel[x.os]});
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(para)){er.textContent='Informe um e-mail válido para envio.';return}if(!sel.length){er.textContent='Marque pelo menos uma OS para contestar.';return}
    CFG.contEmail=para;var q_=S.rq==null?1:S.rq;var em='19/10 '+hora();S.contest=S.contest||{};sel.forEach(function(x){S.contest[x.os]={em:em,para:para}});S.contests=S.contests||[];S.contests.push({n:sel.length,ciclo:REP_Q[q_].ciclo,para:para,ass:document.getElementById('ctAss').value,txt:document.getElementById('ctTxt').value,em:em,by:actor(S.role),itens:sel.map(function(x){return{os:x.os,atv:x.atv,prod:x.prod}})});
    logA('fin','enviou contestação de '+sel.length+' OS do ciclo '+REP_Q[q_].ciclo+' para '+para);closeSheet();render();toast('Contestação enviada para '+para+' com a planilha anexada.','send');return}
  if(t.id==='gerarCont'){S.rep=true;logA('fin','gerou a planilha de contestação do repasse');render();toast('Planilha de contestação gerada com 2 OS (simulação).');return}
  if(t.id==='fatUp'){S.fat=true;logA('fin','atualizou os pagamentos das faturas');render();toast('Pagamentos atualizados em todos os meses de uma vez.');return}
});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='qq'){S.qq=t.value;var ps=t.selectionStart;render();var nq=document.getElementById('qq');if(nq){nq.focus();nq.setSelectionRange(ps,ps)}return}if(t.id==='andQ'){S.andQ=t.value;var aqp=t.selectionStart;render();var aqn=document.getElementById('andQ');if(aqn){aqn.focus();aqn.setSelectionRange(aqp,aqp)}return}if(t.id==='atQ'){S.atQ=t.value;var qp_=t.selectionStart;sheet(atDoneList(),true);var qn_=document.getElementById('atQ');if(qn_){qn_.focus();qn_.setSelectionRange(qp_,qp_)}return}if(t.id==='aq'){S.aq=t.value;var ap_=t.selectionStart;render();var an_=document.getElementById('aq');if(an_){an_.focus();an_.setSelectionRange(ap_,ap_)}return}if(t.id==='hq'){S.hq=t.value;var hp=t.selectionStart;render();var hn=document.getElementById('hq');if(hn){hn.focus();hn.setSelectionRange(hp,hp)}return}if(t.id==='cliQ'){S.cq=t.value;var pos=t.selectionStart;render();var n=document.getElementById('cliQ');if(n){n.focus();n.setSelectionRange(pos,pos)}return}if(t.dataset&&t.dataset.cf&&S.cf[S.cad]){S.cf[S.cad][t.dataset.cf]=t.value;return}if(t.dataset&&t.dataset.f){var ctx=ctxOf(t);var F=S.form[ctx]=S.form[ctx]||{vel:600,pag:'Boleto'};F[t.dataset.f]=t.value;if(t.dataset.f==='cpf'){var cm=document.getElementById('cpfmsg-'+ctx);if(cm)cm.innerHTML=cpfMsg(F)}}});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='andV'){S.andV=t.value;render();return}if(t.id==='pyComp'){var lb=document.getElementById('pyCompLb');if(lb&&t.files&&t.files[0]){lb.textContent='Anexado: '+t.files[0].name;t.parentNode.classList.add('ok')}return}if(t.dataset&&t.dataset.csel){S.csel[t.dataset.csel]=t.checked;var keep={p:document.getElementById('ctPara').value,a:document.getElementById('ctAss').value};contSheet();document.getElementById('ctPara').value=keep.p;document.getElementById('ctAss').value=keep.a;return}if(t.dataset&&t.dataset.supof){var ss=seller(+t.dataset.supof);ss.sup=+t.value||null;if(ss.sup)ss.equipe=seller(ss.sup).equipe;logA('fin',(ss.sup?'associou '+ss.nome+' ao supervisor '+seller(ss.sup).nome:'deixou '+ss.nome+' sem supervisor'));render();toast('Associação atualizada.');return}if(t.dataset&&t.dataset.cf==='tt'&&S.cf[S.cad]){S.cf[S.cad].tt=t.value;render();return}if(!t.classList.contains('cfgin'))return;var D=draftCfg(),d=t.dataset;
  if(d.base)D.base[d.base]=Math.max(0,+t.value||0);else if(d.ppct!==undefined)D.perfis[+d.ppct].pct=Math.max(0,+t.value||0);
  else if(d.pnome!==undefined){var i=+d.pnome,old=D.perfis[i].nome,nv=t.value.trim()||old;if(D.perfis.some(function(p,k){return k!==i&&p.nome===nv})){toast('Já existe um perfil com esse nome.','alert');nv=old}D.perfis[i].nome=nv;Object.keys(D.sp).forEach(function(k){if(D.sp[k]===old)D.sp[k]=nv})}
  else if(d.sp)D.sp[d.sp]=t.value;render()});
